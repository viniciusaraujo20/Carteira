<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIE Digital - Web App</title>
    <link rel="icon" href="./Src/logo.png" type="image/x-icon">

    <style>
        /* CSS RESET E BASE */
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* ESTRUTURA DE TELAS */
        .screen {
            display: none;
            width: 100%;
            height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(180deg, #2cb5e8 0%, #613093 100%);
            color: white;
        }

        .active { display: flex; }

        /* TELA 1 - COVER */
        #screen1 { cursor: pointer; }
        .logo-capa { width: 120px; margin-bottom: 20px; }

        /* TELA 2 - MENU */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 90%;
            max-width: 400px;
        }
        .menu-item {
            background: rgba(255, 255, 255, 0.15);
            padding: 25px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 14px;
            transition: background 0.3s;
        }
        .menu-item:active { background: rgba(255, 255, 255, 0.3); }
        .disabled { opacity: 0.4; cursor: not-allowed; }

        /* TELA 3 - CARTEIRA */
        #screen3 { background: #fdfdfd; color: #333; justify-content: flex-start; }
        .header-app {
            width: 100%;
            padding: 20px;
            background: linear-gradient(90deg, #2cb5e8, #613093);
            color: white;
            font-size: 18px;
            font-weight: bold;
        }
        .carteira-container {
            margin-top: 40px;
            width: 90%;
            max-width: 450px;
        }
        .img-card {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            cursor: pointer;
        }
        .hint-text { color: #999; font-size: 12px; margin-top: 10px; cursor: pointer; }

        /* FOOTER NAV */
        .footer-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 70px;
            display: flex;
            background: white;
            border-top: 1px solid #eee;
        }
        .nav-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #888;
            cursor: pointer;
        }
        .nav-btn.active-btn { color: #613093; font-weight: bold; }

        /* OVERLAY FULLSCREEN */
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        #overlay img {
            width: 95%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
        }
        .close-hint {
            position: absolute;
            bottom: 30px;
            color: white;
            font-size: 14px;
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div id="screen1" class="screen active" onclick="goTo('screen2')">
        <img src="Src/logo.png" class="logo-capa" alt="CIE">
        <h2>CARTEIRA DE IDENTIFICAÇÃO<br>ESTUDANTIL</h2>
        <p style="margin-top: 50px; font-size: 12px;">Desenvolvido por FSBR</p>
    </div>

    <div id="screen2" class="screen">
        <div class="menu-grid">
            <div class="menu-item" onclick="goTo('screen3')">
                <span>💳</span><br>Exibir CIE
            </div>
            <div class="menu-item" onclick="goTo('screen3')">
                <span>📲</span><br>Instalar CIE
            </div>
            <div class="menu-item" onclick="alert('Sem registros encontrados.')">
                <span>🚚</span><br>Acompanhar Solicitação
            </div>
            <div class="menu-item disabled">
                <span>📖</span><br>Ver introdução
            </div>
        </div>
        <p style="position: absolute; bottom: 20px; font-size: 10px;">Versão 2.1.12.18</p>
    </div>

    <div id="screen3" class="screen">
        <div class="header-app">Minha Carteira</div>
        
        <div class="carteira-container">
            <img src="./Src/Carteira.png" class="img-card" onclick="toggleFull(true)">
            <p class="hint-text" onclick="toggleFull(true)">TOQUE PARA VER EM FULL HD</p>
        </div>

        <div class="footer-nav">
            <div class="nav-btn active-btn"><span>🎫</span>Carteira</div>
            <div class="nav-btn" onclick="alert('Funcionalidade em breve!')"><span>📍</span>Onde usar</div>
            <div class="nav-btn" onclick="alert('Funcionalidade em breve!')"><span>🎁</span>Vantagens</div>
            <div class="nav-btn" onclick="alert('Funcionalidade em breve!')"><span>👤</span>Meu Perfil</div>
        </div>
    </div>

    <div id="overlay" onclick="toggleFull(false)">
        <img src="./Src/Carteira.png" alt="CIE Fullscreen">
        <div class="close-hint">Toque para fechar</div>
    </div>

    <script>
     
        // Tenta forçar o fullscreen assim que houver QUALQUER interação
    // Isso é o máximo que o navegador permite por segurança
    window.addEventListener('click', function() {
        ativarFullscreenReal();
    }, { once: true }); // O 'once: true' faz o código rodar só no primeiro clique

    function ativarFullscreenReal() {
        const element = document.documentElement; // Pega o site inteiro
        
        if (element.requestFullscreen) {
            element.requestFullscreen();
        } else if (element.webkitRequestFullscreen) { /* Chrome, Safari e Opera */
            element.webkitRequestFullscreen();
        } else if (element.msRequestFullscreen) { /* Internet Explorer / Edge */
            element.msRequestFullscreen();
        }
    }

    function goTo(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // Função do Zoom da Carteira (mantida)
    function toggleZoom() {
        const container = document.getElementById('wrapper');
        const backdrop = document.getElementById('backdrop');
        
        if (container.classList.contains('zoom-effect')) {
            container.classList.remove('zoom-effect');
            backdrop.style.display = 'none';
        } else {
            container.classList.add('zoom-effect');
            backdrop.style.display = 'block';
        }
    }
        // Função para trocar de tela
        function goTo(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // Função para ligar/desligar tela cheia
        function toggleFull(show) {
            const overlay = document.getElementById('overlay');
            overlay.style.display = show ? 'flex' : 'none';
        }
    </script>
</body>
</html>
