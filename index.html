<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./Src/logo.png" type="image/x-icon">
    <title>CIE Digital</title>
    <style>
        /* --- ESTILOS GERAIS --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; 
            font-family: 'Segoe UI', sans-serif; 
            height: 100%; overflow: hidden; 
            background: #000; 
        }

        /* Estrutura de Telas */
        .screen { 
            display: none; 
            width: 100%; height: 100vh; 
            flex-direction: column; align-items: center; 
            text-align: center; color: white; 
        }
        .active { display: flex; }

        /* TELA 1 e 2 (Fundo Degradê) */
        #screen1, #screen2 { 
            background: linear-gradient(180deg, #2cb5e8 0%, #613093 100%); 
            justify-content: center;
        }

        /* TELA 2 - MENU */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 90%; max-width: 400px; }
        .menu-item { 
            background: rgba(255,255,255,0.2); padding: 30px 10px; 
            border-radius: 15px; border: 1px solid rgba(255,255,255,0.3); 
            cursor: pointer;
        }
        .disabled { opacity: 0.5; cursor: not-allowed; }

        /* TELA 3 - CARTEIRA (Fundo Claro) */
        #screen3 { background: #fdfdfd; color: #333; justify-content: flex-start; }
        .header-app { 
            width: 100%; padding: 20px; 
            background: linear-gradient(90deg, #2cb5e8, #613093); 
            color: white; font-weight: bold; font-size: 18px;
        }

        /* --- LÓGICA DO ZOOM (AMPLIAÇÃO) --- */
        .carteira-container { margin-top: 40px; width: 90%; max-width: 400px; z-index: 10; transition: all 0.3s ease; }
        .img-card { width: 100%; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); cursor: pointer; }
        
        /* Esta classe faz a mágica de "saltar" na frente de tudo */
        .zoom-effect {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(1.15); /* Centraliza e aumenta 15% */
            width: 95vw;
            z-index: 999;
        }

        /* Fundo escuro atrás da imagem quando ampliada */
        #backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 998;
        }

        /* FOOTER NAV */
        .footer-nav { position: fixed; bottom: 0; width: 100%; display: flex; background: white; border-top: 1px solid #eee; height: 70px; }
        .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: #888; }
        .nav-btn.active-btn { color: #613093; font-weight: bold; }
    </style>
</head>
<body>

    <div id="screen1" class="screen active" onclick="goTo('screen2')">
        <img src="./Src/logo.png" style="width: 100px; margin-bottom: 20px;" alt="">
        <h2>CARTEIRA DE IDENTIFICAÇÃO<br>ESTUDANTIL</h2>
        <p>Toque para iniciar</p>
    </div>

    <div id="screen2" class="screen">
        <div class="menu-grid">
            <div class="menu-item" onclick="goTo('screen3')">Exibir CIE</div>
            <div class="menu-item" onclick="goTo('screen3')">Instalar CIE</div>
            <div class="menu-item" onclick="alert('Sem registros encontrados.')">Acompanhar</div>
            <div class="menu-item disabled">Ver Introdução</div>
        </div>
    </div>

    <div id="screen3" class="screen">
        <div class="header-app">Minha Carteira</div>
        
        <div id="wrapper" class="carteira-container">
            <img src="./Src/Carteira.png" class="img-card" onclick="toggleZoom()">
            <p style="color: #999; font-size: 12px; margin-top: 15px; cursor: pointer;" onclick="toggleZoom()">
                TOQUE PARA VER EM FULL HD
            </p>
        </div>

        <div class="footer-nav">
            <div class="nav-btn active-btn">Carteira</div>
            <div class="nav-btn">Onde usar</div>
            <div class="nav-btn">Vantagens</div>
            <div class="nav-btn">Perfil</div>
        </div>
    </div>

    <div id="backdrop" onclick="toggleZoom()"></div>

    <script>
        // Função para trocar de tela
        function goTo(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // Função para ampliar/reduzir a imagem
        function toggleZoom() {
            const container = document.getElementById('wrapper');
            const backdrop = document.getElementById('backdrop');
            
            if (container.classList.contains('zoom-effect')) {
                container.classList.remove('zoom-effect');
                backdrop.style.display = 'none';
            } else {
                container.classList.add('zoom-effect');
                backdrop.style.display = 'block';
            }
        }
    </script>
</body>
</html>
