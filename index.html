<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/Src/logo.png" type="image/x-icon">
    <title>CIE Digital</title>
    <style>
        /* CSS - Estilização Geral */
        body, html {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            height: 100%;
            overflow: hidden; /* Evita rolagem entre telas */
        }

        .screen {
            display: none; /* Esconde todas as telas por padrão */
            width: 100%;
            height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(180deg, #4facfe 0%, #a044ff 100%); /* Degradê parecido com as fotos */
            color: white;
        }

        .active {
            display: flex; /* Apenas a tela com classe 'active' aparece */
        }

        /* TELA 1 - Cover */
        #screen1 { cursor: pointer; }

        /* TELA 2 - Menu */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }
        .menu-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .disabled { opacity: 0.5; cursor: not-allowed; }

        /* TELA 3 - Exibição da Carteira */
        #screen3 { background: #f4f4f4; color: #333; justify-content: flex-start; }
        .header-carteira {
            width: 100%;
            padding: 15px 0;
            background: #4facfe;
            color: white;
            font-weight: bold;
        }
        .carteira-img {
            width: 90%;
            max-width: 400px;
            margin: 20px 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border-radius: 10px;
        }
        .footer-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            display: flex;
            background: white;
            border-top: 1px solid #ddd;
        }
        .nav-item {
            flex: 1;
            padding: 15px 0;
            font-size: 12px;
            color: #666;
            cursor: pointer;
        }
        .nav-item.active-nav { color: #a044ff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="screen1" class="screen active" onclick="changeScreen('screen2')">
        <img src="/Src/logo.png" alt="Logo CIE">
        <h1>CARTEIRA DE IDENTIFICAÇÃO ESTUDANTIL</h1>
        <p>Desenvolvido por FSBR</p>
    </div>

    <div id="screen2" class="screen">
        <div class="menu-grid">
            <div class="menu-item" onclick="changeScreen('screen3')">Exibir CIE</div>
            <div class="menu-item" onclick="changeScreen('screen3')">Instalar CIE</div>
            <div class="menu-item" onclick="alert('Sem registros')">Acompanhar Solicitação</div>
            <div class="menu-item disabled">Ver Introdução</div>
        </div>
    </div>

    <div id="screen3" class="screen">
        <div class="header-carteira">Minha Carteira</div>
        
        <img src="/Src/Carteira.png" class="carteira-img" alt="Carteira">
        
        <p style="font-size: 10px; color: #999;">TOQUE PARA VER EM FULL HD</p>

        <div class="footer-nav">
            <div class="nav-item active-nav">Carteira</div>
            <div class="nav-item" onclick="alert('Onde usar em breve')">Onde usar</div>
            <div class="nav-item" onclick="alert('Vantagens em breve')">Vantagens</div>
            <div class="nav-item" onclick="alert('Meu perfil em breve')">Meu Perfil</div>
        </div>
    </div>

    <script>
        // Função simples para trocar de tela
        function changeScreen(screenId) {
            // Remove a classe 'active' de todas as telas
            const screens = document.querySelectorAll('.screen');
            screens.forEach(s => s.classList.remove('active'));

            // Adiciona a classe 'active' na tela desejada
            document.getElementById(screenId).classList.add('active');
        }
    </script>
</body>
</html>
